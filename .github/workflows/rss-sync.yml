name: Substack RSS Sync

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install beautifulsoup4 lxml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync Substack RSS into data.js
        run: python scripts/rss_sync_data.py --apply

      - name: Translate new/changed issues to English + Hindi (only if TRANSLATE_API_KEY secret is set)
        env:
          TRANSLATE_API_KEY: ${{ secrets.TRANSLATE_API_KEY }}
          TRANSLATE_API_BASE: ${{ vars.TRANSLATE_API_BASE }}
          TRANSLATE_MODEL: ${{ vars.TRANSLATE_MODEL }}
          TRANSLATE_MAX_ISSUES: '3'
        run: node scripts/translate_missing.mjs

      - name: Rebuild Libri, trilingual SEO pages (it/en/hi), SPA data, sitemaps, and Atom feed
        run: |
          node scripts/fetch_issue_meta.mjs
          node scripts/build_libri_data.mjs
          node scripts/build_i18n_data.mjs
          node scripts/build_archive_seo.mjs
          node scripts/build_covers.mjs || echo "covers: kept previous"
          node scripts/build_static_pages.mjs
          node scripts/build_feed.mjs
          node scripts/i18n_status.mjs

      - name: Validate syntax and generated outputs
        run: |
          node --check data.js
          node --check App.js
          node --check utils.js
          node --check data.en.js
          node --check data.hi.js
          python -c "import xml.etree.ElementTree as ET; [ET.parse(f) for f in ('sitemap.xml','sitemap-pages.xml','sitemap-archive.xml','feed.xml')]; print('XML valid')"
          python scripts/validate_i18n.py
          python scripts/validate_seo.py --quiet

      - name: Open or update PR with synced issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # only open a PR when content changed (not just lastmod dates)
          if [ -z "$(git status --porcelain -- data.js i18n/en.json i18n/hi.json libri/books_cited.json)" ]; then
            echo "Archive already up to date — no PR needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B bot/rss-sync
          git add -A
          git commit -m "chore(rss-sync): sync Substack issues, SEO pages, libri, feed & sitemap"
          git push -f origin bot/rss-sync
          OPEN_PR=$(gh pr list --head bot/rss-sync --state open --json number --jq '.[0].number // empty')
          if [ -z "$OPEN_PR" ]; then
            gh pr create \
              --base main \
              --head bot/rss-sync \
              --title "chore(rss-sync): aggiornamento automatico archivio da Substack" \
              --body "Sincronizzazione automatica da \`https://fortissimo.substack.com/feed\` via \`scripts/rss_sync_data.py\`, rigenerazione pagine SEO trilingue (\`archivio/\`, \`en/archive/\`, \`hi/archive/\`), traduzioni \`i18n/\`, \`libri/books_cited.json\`, \`sitemap.xml\` e \`feed.xml\`."
          else
            echo "Updated existing PR #$OPEN_PR"
          fi
